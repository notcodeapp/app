name: Android CI
# gradlew executable bit fixed (chmod 100755)

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["app/**", ".github/workflows/android.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Patch google-services.json for debug builds
        run: |
          python3 - <<'PY'
          import json, copy
          path = 'app/google-services.json'
          data = json.load(open(path))
          if not any(c['client_info']['android_client_info']['package_name'] == 'com.notcode.mobile.debug' for c in data['client']):
              debug = copy.deepcopy(data['client'][0])
              debug['client_info']['android_client_info']['package_name'] = 'com.notcode.mobile.debug'
              debug['client_info']['mobilesdk_app_id'] += '-debug'
              data['client'].append(debug)
              json.dump(data, open(path, 'w'), indent=2)
          PY
      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Lint
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Assemble debug APKs
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: notcode-debug-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

  release:
    # Собирает и подписывает release-APK только на main; ключи приходят из
    # секретов репозитория и раскладываются в .keys/, как ожидает build.gradle.kts.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing material
        env:
          NOTCODE_RELEASE_PROPERTIES: ${{ secrets.NOTCODE_RELEASE_PROPERTIES }}
          NOTCODE_RELEASE_KEYSTORE_B64: ${{ secrets.NOTCODE_RELEASE_KEYSTORE_B64 }}
        run: |
          mkdir -p ../.keys
          printf '%s' "$NOTCODE_RELEASE_PROPERTIES" > ../.keys/notcode-release.properties
          printf '%s' "$NOTCODE_RELEASE_KEYSTORE_B64" | base64 -d > ../.keys/notcode-release.keystore

      - name: Assemble signed release APKs
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        with:
          name: notcode-release-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  tag-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Patch google-services.json for debug builds
        run: |
          python3 - <<'PY'
          import json, copy
          path = 'app/google-services.json'
          data = json.load(open(path))
          if not any(c['client_info']['android_client_info']['package_name'] == 'com.notcode.mobile.debug' for c in data['client']):
              debug = copy.deepcopy(data['client'][0])
              debug['client_info']['android_client_info']['package_name'] = 'com.notcode.mobile.debug'
              debug['client_info']['mobilesdk_app_id'] += '-debug'
              data['client'].append(debug)
              json.dump(data, open(path, 'w'), indent=2)
          PY
      # Debug-подпись на CI: релизный keystore живёт только у локальной сборки.
      - name: Assemble debug APKs
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Rename artifacts
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p renamed
          for abi in arm64-v8a armeabi-v7a universal; do
            src="app/build/outputs/apk/debug/app-${abi}-debug.apk"
            [ -f "$src" ] && cp "$src" "renamed/notcode-${abi}-v${version}.apk"
          done

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: renamed/*.apk
